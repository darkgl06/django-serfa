[project]
name = "django-serfa"
version = "0.1.0"
description = "Define test services for Django test runs with Testcontainers"
readme = "README.md"
authors = [{ name = "Andrés Garrido", email = "andreslp0001@gmail.com" }]
requires-python = ">=3.12,<4"
dependencies = [
    "django>=5.1.1,<6",
    "testcontainers>=4.8.1,<5",
    "schema>=0.7.7,<0.8",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
